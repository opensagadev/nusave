name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify the release without publishing anything
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and smoke test
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          binary="nusave"
          if [[ "$TARGET" == *-windows-* ]]; then binary+=".exe"; fi
          bundle="nusave-v$version-$TARGET"
          mkdir -p "dist/$bundle"
          cp "target/$TARGET/release/$binary" README.md LICENSE "dist/$bundle/"
          test "$("dist/$bundle/$binary" --version | tr -d '\r')" = "nusave $version"
          cd dist
          if [[ "$TARGET" == *-windows-* ]]; then
            7z a "$bundle.zip" "$bundle"
          else
            tar -czf "$bundle.tar.gz" "$bundle"
          fi
          rm -r "$bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: nusave-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Require main for releases
        if: ${{ !inputs.dry-run && github.ref != 'refs/heads/main' }}
        run: |
          echo 'Releases must be dispatched from main.' >&2
          exit 1
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        if: ${{ !inputs.dry-run }}
        id: auth
      - name: Publish crate
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$DRY_RUN" == true ]]; then
            cargo publish --locked --dry-run
            exit 0
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "Release v$version is already published; bump the version in Cargo.toml." >&2
            exit 1
          fi
          # Skip an existing crates.io version so a failed release can be rerun.
          if curl -fs -A "$GITHUB_REPOSITORY release workflow" -o /dev/null \
            "https://crates.io/api/v1/crates/nusave/$version"; then
            echo "nusave $version is already on crates.io, skipping."
          else
            cargo publish --locked
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub release
    if: ${{ !inputs.dry-run }}
    needs: crates
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nusave-*
          path: dist
          merge-multiple: true
      - name: Create release and upload assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.crates.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.zip ./*.tar.gz > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" > /dev/null; then
            version="${RELEASE_TAG#v}"
            flags=()
            if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "nusave $version" --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
